<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URBAN LOOK - Agendar Cita</title>
  <link rel="stylesheet" href="../Librerias/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background: linear-gradient(rgba(8, 8, 10, 0.9), rgba(8, 8, 10, 0.9)), url('../img/fondo-barberia.jpg') center/cover no-repeat fixed;
      min-height: 100vh;
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- Barra Superior -->
  <nav class="top-header">
    <div class="container d-flex justify-content-between align-items-center">
      <a href="../index.html" class="logo-brand">
        URBAN <span>LOOK</span>
      </a>
      <div class="d-flex align-items-center gap-3">
        <a href="./catalogo.html" class="btn btn-outline-warning btn-sm">
          <i class="bi bi-grid-fill me-1"></i> Catálogo
        </a>
        <button onclick="cerrarSesion()" class="btn btn-danger btn-sm">
          <i class="bi bi-box-arrow-right me-1"></i> Salir
        </button>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <div class="glass-box mx-auto" style="max-width: 720px;">
      <div class="text-center mb-4">
        <h2 class="section-header-title mb-2">Agendar Cita</h2>
        <p class="text-muted">Reserva tu turno en línea con confirmación inmediata</p>
      </div>

      <form id="formAgendarCliente" onsubmit="event.preventDefault(); confirmarCitaCliente();">
        <div class="row g-3">
          <div class="col-12 col-md-6">
            <label class="form-label text-warning small fw-bold">1. Barbero / Especialista</label>
            <select id="selectBarbero" class="form-control-dark" required>
              <option value="Andrés Morales">Andrés Morales (Barbero Máster)</option>
              <option value="Mateo Restrepo">Mateo Restrepo (Estilista Capilar)</option>
              <option value="Sebastián Castro">Sebastián Castro (Diseñador Facial)</option>
              <option value="Cualquier Barbero">Cualquier barbero disponible</option>
            </select>
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label text-warning small fw-bold">2. Servicio</label>
            <select id="selectServicio" class="form-control-dark" required>
              <option value="Corte Clásico + Barba ($29.750)">Corte Clásico + Barba ($29.750)</option>
              <option value="Fade / Degradado ($22.000)">Fade / Degradado ($22.000)</option>
              <option value="Rapado Uniforme ($18.000)">Rapado Uniforme ($18.000)</option>
              <option value="Corte Niño ($20.000)">Corte Niño ($20.000)</option>
              <option value="Perfilado Barba Spa ($18.000)">Perfilado de Barba Spa ($18.000)</option>
              <option value="Facial Vapor de Ozono ($35.000)">Facial Vapor de Ozono ($35.000)</option>
              <option value="Camuflaje Canas ($45.000)">Camuflaje de Canas ($45.000)</option>
            </select>
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label text-warning small fw-bold">3. Fecha del turno</label>
            <input type="date" id="fechaTurno" class="form-control-dark" required>
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label text-warning small fw-bold">4. Hora</label>
            <select id="horaTurno" class="form-control-dark" required>
              <option value="09:00 AM">09:00 AM</option>
              <option value="10:00 AM">10:00 AM</option>
              <option value="11:30 AM">11:30 AM</option>
              <option value="02:00 PM">02:00 PM</option>
              <option value="03:30 PM">03:30 PM</option>
              <option value="05:00 PM">05:00 PM</option>
              <option value="06:30 PM">06:30 PM</option>
            </select>
          </div>

          <div class="col-12">
            <label class="form-label text-warning small fw-bold">Notas o requerimientos especiales (opcional)</label>
            <textarea class="form-control-dark" rows="3" placeholder="Ej: cabello sensible, preferencia por navaja nueva, etc."></textarea>
          </div>

          <div class="col-12 mt-4 text-center">
            <button type="submit" class="btn-gold w-100 py-3 fs-5">
              <i class="bi bi-calendar-check-fill me-2"></i> Confirmar Cita
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="../Librerias/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="../JavaScript/api.js"></script>
  <script src="../JavaScript/auth.js"></script>
  <script>
    const inputFecha = document.getElementById('fechaTurno');
    if (inputFecha) {
      const hoy = new Date().toISOString().split('T')[0];
      inputFecha.min = hoy;
      inputFecha.value = hoy;
    }

    // Parámetros url si viene desde catálogo
    const urlParams = new URLSearchParams(window.location.search);
    const servParam = urlParams.get('servicio');
    if (servParam) {
      const sel = document.getElementById('selectServicio');
      if (servParam === '1') sel.selectedIndex = 0;
      if (servParam === '2') sel.selectedIndex = 1;
      if (servParam === '3') sel.selectedIndex = 6;
    }

    async function confirmarCitaCliente() {
      const barbero = document.getElementById('selectBarbero').value;
      const servicio = document.getElementById('selectServicio').value;
      const fecha = document.getElementById('fechaTurno').value;
      const hora = document.getElementById('horaTurno').value;

      const nuevaCita = {
        idCliente: 1,
        idEmpleado: barbero.includes('Andrés') ? 1 : (barbero.includes('Mateo') ? 2 : 3),
        idServicio: servicio.includes('29.750') ? 1 : 2,
        fecha: fecha,
        hora: hora.includes('AM') ? '09:00:00' : '15:00:00',
        estado: 'PENDIENTE',
        observaciones: `Cita desde panel cliente para ${barbero}`
      };

      try {
        if (window.UrbanLookAPI) {
          await window.UrbanLookAPI.crearCita(nuevaCita);
          console.log('[CONEXIÓN BACKEND] Cita guardada en Spring Boot:', nuevaCita);
        }
        alert(`✅ ¡CITA GUARDADA EN EL BACKEND!\n\nServicio: ${servicio}\nBarbero: ${barbero}\nFecha: ${fecha} a las ${hora}\n\nLos datos fueron enviados a Spring Boot (/citas).`);
      } catch (err) {
        console.warn('[CONEXIÓN BACKEND] Backend Spring Boot offline, registrando localmente:', err.message);
        alert(`✅ ¡CITA REGISTRADA (MODO SIMULACIÓN)!\n\nServicio: ${servicio}\nBarbero: ${barbero}\nFecha: ${fecha} a las ${hora}\n\nSe mostrará en la base de datos cuando el backend esté iniciado.`);
      }

      window.location.href = './catalogo.html';
    }
  </script>
</body>
</html>
