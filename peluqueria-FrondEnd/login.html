<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peluquería - Iniciar Sesión</title>
  <link rel="stylesheet" href="./Librerias/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="./css/estilos.css">
</head>
<body class="bg-secondary d-flex align-items-center min-vh-100">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5">
        <div class="card shadow-sm border-0 rounded-4 p-4">
          <div class="text-center mb-4">
            <h2 class="fw-bold">Iniciar Sesión</h2>
            <p class="text-muted">Accede a tu cuenta de cliente o administración</p>
          </div>

          <form id="formLogin">
            <div class="mb-3">
              <label for="usuario" class="form-label fw-semibold">Usuario / Correo</label>
              <input type="text" class="form-control form-control-lg" id="usuario" placeholder="ingrese el usuario o correo" required>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label fw-semibold">Contraseña</label>
              <input type="password" class="form-control form-control-lg" id="password" required placeholder="ingrese la contraseña">
            </div>

            <div class="mb-3">
              <label for="rolSimulado" class="form-label fw-semibold">Ingresar como :</label>
              <select class="form-select" id="rolSimulado">
                <option value="CLIENTE">Usuario</option>
                <option value="EMPLEADO">Empleado</option>
                <option value="ADMIN">Administrador</option>
              </select>
            </div>

            <button type="submit" class="btn btn-dark btn-lg w-100 mt-2">Entrar</button>
          </form>

          <div class="text-center mt-4">
            <small class="text-muted">¿No tienes cuenta? <a href="./registro.html" class="text-decoration-none">Regístrate aquí</a></small>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="./Librerias/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="./JavaScript/auth.js"></script>
</body>
</html>
