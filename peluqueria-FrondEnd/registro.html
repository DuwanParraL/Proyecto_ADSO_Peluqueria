<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URBAN LOOK - Registrarme</title>
  <link rel="stylesheet" href="./Librerias/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="./css/estilos.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background: linear-gradient(rgba(8, 8, 10, 0.85), rgba(8, 8, 10, 0.85)), url('./img/fondo-barberia.jpg') center/cover no-repeat fixed;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }
  </style>
</head>
<body>

  <div class="modal-card-custom modal-wide" style="margin: auto;">
    <div class="text-start mb-3">
      <a href="./index.html" class="text-warning small text-decoration-none">
        <i class="bi bi-arrow-left"></i> Volver a Urban Look
      </a>
    </div>

    <h2 class="modal-title-custom">REGISTRARME</h2>
    <p class="modal-subtitle-custom">Crea tu cuenta de cliente en URBAN LOOK</p>

    <form id="formRegistroPagina" onsubmit="event.preventDefault(); alert('¡Cuenta creada exitosamente! Ahora inicia sesión.'); window.location.href='./login.html';">
      <div class="row g-3">
        <div class="col-12 col-sm-6">
          <label class="form-label text-warning small fw-bold">Nombre</label>
          <input type="text" class="form-control-dark" placeholder="Tu nombre" required>
        </div>
        <div class="col-12 col-sm-6">
          <label class="form-label text-warning small fw-bold">Apellido</label>
          <input type="text" class="form-control-dark" placeholder="Tu apellido" required>
        </div>

        <div class="col-12 col-sm-6">
          <label class="form-label text-warning small fw-bold">Tipo de Documento</label>
          <select class="form-control-dark" required>
            <option value="CC">Cédula de Ciudadanía (CC)</option>
            <option value="TI">Tarjeta de Identidad (TI)</option>
            <option value="CE">Cédula de Extranjería (CE)</option>
            <option value="PASAPORTE">Pasaporte</option>
          </select>
        </div>
        <div class="col-12 col-sm-6">
          <label class="form-label text-warning small fw-bold">Número de Documento</label>
          <input type="text" class="form-control-dark" placeholder="Número de documento" required>
        </div>

        <div class="col-12 col-sm-6">
          <label class="form-label text-warning small fw-bold">Email</label>
          <input type="email" class="form-control-dark" placeholder="micompania@correo.com" required>
        </div>
        <div class="col-12 col-sm-6">
          <label class="form-label text-warning small fw-bold">Celular</label>
          <input type="tel" class="form-control-dark" placeholder="318 000 0000" required>
        </div>

        <div class="col-12 col-sm-6">
          <label class="form-label text-warning small fw-bold">Contraseña</label>
          <input type="password" class="form-control-dark" placeholder="Escribe tu contraseña" required>
        </div>
        <div class="col-12 col-sm-6">
          <label class="form-label text-warning small fw-bold">Verificar Contraseña</label>
          <input type="password" class="form-control-dark" placeholder="Repite tu contraseña" required>
        </div>

        <div class="col-12 mt-4">
          <button type="submit" class="btn-gold w-100 py-2 fs-6">Registrarse</button>
        </div>

        <div class="col-12 text-center mt-3">
          <small class="text-muted">¿Ya tienes una cuenta? <a href="./login.html" class="text-warning fw-bold">Inicia sesión aquí</a></small>
        </div>
      </div>
    </form>
  </div>

  <script src="./Librerias/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
